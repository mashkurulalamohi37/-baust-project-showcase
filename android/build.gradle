allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Fix for AGP 8.0+ namespace issues in older plugins
subprojects {
    def configureNamespace = { p ->
        try {
            if (p.hasProperty('android')) {
                if (p.android.namespace == null) {
                    p.android.namespace = p.group ?: "com.example.${p.name.replaceAll("-", "_")}"
                }
            }
        } catch (Exception e) {
            // Ignore errors for non-android projects
        }
    }

    if (project.state.executed) {
        configureNamespace(project)
    } else {
        project.afterEvaluate { p -> configureNamespace(p) }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
