<!DOCTYPE html>
<html lang="en">

<head>
  <base href="/baust-project-showcase/">

  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Primary Meta Tags -->
  <title>BAUST Project Showcase - Academic Projects & Research</title>
  <meta name="title" content="BAUST Project Showcase - Academic Projects & Research">
  <meta name="description"
    content="Discover and share academic projects, thesis work, and research from Bangladesh Army University of Science and Technology. Browse trending projects and upload your own work.">
  <meta name="keywords" content="BAUST, projects, academic, research, thesis, university, Bangladesh, showcase">
  <meta name="author" content="BAUST">

  <!-- iOS Specific Meta Tags for PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BAUST Projects">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS Splash Screens -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <!-- Apple Touch Icons (various sizes for different devices) -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">

  <!-- Android/Chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f3460">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f3460">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a2e">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" type="image/png" href="favicon.png" />

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BAUST Project Showcase">
  <meta property="og:description" content="Discover and share academic projects, thesis work, and research from BAUST">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="BAUST Project Showcase">
  <meta property="twitter:description"
    content="Discover and share academic projects, thesis work, and research from BAUST">
  <meta property="twitter:image" content="icons/Icon-512.png">

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>


  <!-- Firebase SDK -->
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>

  <style>
    /* Loading screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading.loaded {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: white;
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 16px;
    }

    /* Install Banner */
    #install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      color: white;
      padding: 16px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
      z-index: 10000;
      display: none;
      animation: slideUp 0.3s ease-out;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    #install-banner.show {
      display: block;
    }

    .install-content {
      max-width: 600px;
      margin: 0 auto;
    }

    .install-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .install-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      margin-right: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .install-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .install-subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin: 0;
    }

    .install-instructions {
      font-size: 14px;
      line-height: 1.6;
      margin: 12px 0;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .install-step {
      display: flex;
      align-items: center;
      margin: 8px 0;
    }

    .install-step-icon {
      font-size: 20px;
      margin-right: 8px;
    }

    .install-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .install-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .install-btn-primary {
      background: white;
      color: #0f3460;
    }

    .install-btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .install-btn:active {
      transform: scale(0.98);
    }

    /* Prevent iOS bounce scroll */
    body {
      position: fixed;
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1a1a2e;
    }

    #app-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">Loading BAUST Projects...</div>
  </div>

  <!-- Install Banner -->
  <div id="install-banner">
    <div class="install-content">
      <div class="install-header">
        <img src="icons/Icon-192.png" alt="App Icon" class="install-icon">
        <div>
          <h3 class="install-title">Install BAUST Projects</h3>
          <p class="install-subtitle">Get the full app experience</p>
        </div>
      </div>

      <!-- iOS Instructions -->
      <div id="ios-instructions" style="display: none;">
        <div class="install-instructions">
          <div class="install-step">
            <span class="install-step-icon">1️⃣</span>
            <span>Tap the <strong>Share</strong> button <svg width="16" height="16" viewBox="0 0 24 24"
                fill="currentColor">
                <path
                  d="M16 5l-1.42 1.42-1.59-1.59V16h-1.98V4.83L9.42 6.42 8 5l4-4 4 4zm4 5v11c0 1.1-.9 2-2 2H6c-1.11 0-2-.9-2-2V10c0-1.11.89-2 2-2h3v2H6v11h12V10h-3V8h3c1.1 0 2 .89 2 2z" />
              </svg> in Safari</span>
          </div>
          <div class="install-step">
            <span class="install-step-icon">2️⃣</span>
            <span>Select <strong>"Add to Home Screen"</strong></span>
          </div>
          <div class="install-step">
            <span class="install-step-icon">3️⃣</span>
            <span>Tap <strong>"Add"</strong> to install</span>
          </div>
        </div>
      </div>

      <!-- Android/Generic Message -->
      <div id="android-instructions" style="display: none;">
        <div class="install-instructions">
          <p style="margin: 0;">Install this application on your home screen for quick and easy access when you're on
            the go.</p>
        </div>
      </div>

      <div class="install-buttons">
        <button id="install-button" class="install-btn install-btn-primary" onclick="handleInstallClick()">Got
          it!</button>
        <button class="install-btn install-btn-secondary" onclick="dismissInstallBanner()">Remind me later</button>
      </div>
    </div>
  </div>

  <!-- App Container -->
  <div id="app-container">
    <script>
      window.addEventListener('load', function (ev) {
        // Download main.dart.js
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: {{ flutter_service_worker_version }},
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
    </script>
    <script src="main.dart.js" type="application/javascript"></script>
  </div>

  <script>
    // Detect iOS
    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    }

    // Detect if running in standalone mode (already installed)
    function isInStandaloneMode() {
      return ('standalone' in window.navigator) && (window.navigator.standalone) ||
        window.matchMedia('(display-mode: standalone)').matches;
    }

    // Show Install Banner
    function showInstallBanner() {
      const banner = document.getElementById('install-banner');
      const dismissed = localStorage.getItem('install-dismissed');
      const remindLaterTime = localStorage.getItem('install-remind-later');

      if (dismissed === 'true') return;

      if (remindLaterTime) {
        const now = new Date().getTime();
        const reminderTime = parseInt(remindLaterTime);
        if (now < reminderTime) return;
      }

      // iOS Logic
      if (isIOS() && !isInStandaloneMode()) {
        document.getElementById('ios-instructions').style.display = 'block';
        document.getElementById('android-instructions').style.display = 'none';
        document.getElementById('install-button').innerText = 'Got it!';
        setTimeout(() => banner.classList.add('show'), 3000);
      }

      // Android/Desktop PWA Logic
      if (deferredPrompt) {
        document.getElementById('ios-instructions').style.display = 'none';
        document.getElementById('android-instructions').style.display = 'block';
        document.getElementById('install-button').innerText = 'Install';
        setTimeout(() => banner.classList.add('show'), 3000);
      }
    }

    function handleInstallClick() {
      if (deferredPrompt) {
        // Show the native prompt
        deferredPrompt.prompt();
        // Wait for the user to respond to the prompt
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
            localStorage.setItem('install-dismissed', 'true');
          } else {
            console.log('User dismissed the install prompt');
          }
          deferredPrompt = null;
          dismissInstallBanner();
        });
      } else {
        // iOS or just closing
        dismissInstallBanner(true); // Persist dismissal for iOS 'Got it'
      }
    }

    function dismissInstallBanner(persist = false) {
      const banner = document.getElementById('install-banner');
      banner.classList.remove('show');
      if (persist) {
        localStorage.setItem('install-dismissed', 'true');
      }
    }

    function remindLater() {
      const banner = document.getElementById('install-banner');
      banner.classList.remove('show');
      const threeDaysFromNow = new Date().getTime() + (3 * 24 * 60 * 60 * 1000);
      localStorage.setItem('install-remind-later', threeDaysFromNow.toString());
    }

    // Service Worker Registration with Update Handling
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Add timestamp to force update service worker file
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + new Date().getTime();

        navigator.serviceWorker.register(serviceWorkerUrl)
          .then(function (registration) {
            console.log('Service Worker registered successfully:', registration.scope);

            // Check for updates
            registration.onupdatefound = function () {
              var installingWorker = registration.installing;
              installingWorker.onstatechange = function () {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    // New content is available
                    console.log('New content is available; please refresh.');
                    // Trigger a reload or notify user here if needed
                    // For now we'll just log
                  } else {
                    console.log('Content is cached for offline use.');
                  }
                }
              };
            };
          })
          .catch(function (error) {
            console.log('Service Worker registration failed:', error);
          });
      });
    }

    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      loading.classList.add('loaded');
      setTimeout(() => loading.remove(), 500);
    });

    // Fallback: Hide loading screen after 5 seconds
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('loaded');
        setTimeout(() => loading.remove(), 500);
      }
    }, 5000);

    // Android Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showInstallBanner();
      console.log('Install prompt captured');
    });

    // Try to show banner for iOS (deferredPrompt won't fire)
    setTimeout(showInstallBanner, 1000);

    // Track installation
    window.addEventListener('appinstalled', () => {
      console.log('PWA was installed');
      deferredPrompt = null;
    });

    // Prevent zoom on iOS
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    // Handle safe area insets for iOS notch
    if (isIOS()) {
      document.documentElement.style.setProperty('--safe-area-inset-top', 'env(safe-area-inset-top)');
      document.documentElement.style.setProperty('--safe-area-inset-bottom', 'env(safe-area-inset-bottom)');
    }

    // Fix keyboard resize issues on mobile web
    let lastHeight = window.innerHeight;
    window.visualViewport.addEventListener('resize', () => {
      const currentHeight = window.visualViewport.height;

      // If viewport height increased (keyboard likely closed)
      if (currentHeight > lastHeight) {
        // Force scroll to top and reset layout
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;

        // Force layout recalculation
        const appContainer = document.getElementById('app-container');
        if (appContainer) {
          appContainer.style.height = window.innerHeight + 'px';
          setTimeout(() => {
            appContainer.style.height = '100%';
          }, 100);
        }
      }

      lastHeight = currentHeight;
    });
  </script>
</body>

</html>
